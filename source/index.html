<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#142443">
  <title>RedCat SuperKarts</title>
  <link rel="icon" href="/assets/ui/original.ico" type="image/x-icon">
  <link rel="stylesheet" href="/src/style.css">
  <script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head>
<body>
  <main id="app">
    <canvas id="world" aria-label="Origineel circuit"></canvas>
    <canvas id="race-hud" aria-label="Ronde, rondetijd en snelste ronde" hidden></canvas>
    <section id="screen" aria-live="polite"></section>
    <section id="intro" hidden>
      <video id="movie" playsinline preload="metadata"></video>
      <div class="movie-actions"><button id="movie-audio" hidden>Geluid inschakelen</button><button id="skip-movie" hidden>Overslaan</button></div>
    </section>
    <section id="viewer-hud" hidden>
      <header><button id="leave-viewer">Terug</button><strong id="track-title"></strong><button id="viewer-settings">Instellingen</button></header>
      <div id="viewer-caption"><b>Circuit bekijken</b><span>Sleep om rond te kijken · scroll of knijp om te zoomen</span></div>
      <output id="render-size"></output>
    </section>
    <div id="touch-controls" aria-label="Aanraakbediening" hidden>
      <div id="touch-wheel" role="group" aria-label="Stuur: links en rechts sturen, boven gas geven, onder achteruit" aria-describedby="touch-wheel-help" tabindex="0">
        <img src="/assets/touch/steering-wheel.svg" alt="" draggable="false">
        <span class="touch-wheel-forward" aria-hidden="true">▲ Gas</span>
        <span class="touch-wheel-reverse" aria-hidden="true">Achteruit ▼</span>
      </div>
      <span id="touch-wheel-help" class="visually-hidden">Houd het stuur vast. Beweeg je vinger naar links of rechts om te sturen, naar boven om gas te geven en naar beneden om te remmen en achteruit te rijden.</span>
      <div class="touch-actions">
        <button id="touch-brake" data-input="handbrake" aria-label="Rem (Alt)" title="Rem — dezelfde handrem als Alt">
          <img src="/assets/touch/brake-pedal.svg" alt="" draggable="false"><span aria-hidden="true">Rem</span>
        </button>
        <button id="touch-bonus" data-input="bonus" aria-label="Gebruik bonus (Ctrl)" title="Gebruik bonus">
          <img src="/assets/touch/bonus.png" alt="" draggable="false"><span aria-hidden="true">Bonus</span>
        </button>
      </div>
      <button id="touch-stop">Stoppen</button>
    </div>
    <div id="message" role="status" hidden></div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
