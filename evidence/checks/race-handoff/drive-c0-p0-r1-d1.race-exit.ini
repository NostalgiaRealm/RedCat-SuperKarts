;************************************************
;********************BEST TIMES******************
;************************************************
[BEST TIMES]
;================================================
; LAP_RECORD_Ex (x=zero based track index)
; lap record in msecs, saved by game.
;================================================
; RACE_RECORD_Ex (x=zero based track index)
; race record in msecs, saved by game.
;================================================
; TIME_CHECK_COUNT_Ex (x=zero based track index)
; Number of checkpoints found in track.
; This is only saved in city tracks.
;================================================
; TIME_CHECK_Ex_Cy (x=zero base track index,
; y=zero based checkpoint index)
; Time the player had when the checkpoint is
; passed. This is only saved when the player
; had a lap record (saved in city tracks).
;================================================
