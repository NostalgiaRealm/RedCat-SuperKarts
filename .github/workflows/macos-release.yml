name: macOS release packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag and draft release to package
        required: true
        type: string
      skip_build_checks:
        description: Build and upload without version or packaged-payload checks
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: macos-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      RCSK_RELEASE_TAG: ${{ inputs.tag }}
      RCSK_BUILD_ARCH: ${{ matrix.arch }}
      RCSK_SKIP_BUILD_CHECKS: ${{ inputs.skip_build_checks && '1' || '0' }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Check out the frozen release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Install Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Check version metadata and existing release
        if: ${{ !inputs.skip_build_checks }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {GAME_VERSION} from './source/version.js';
          const pkg=JSON.parse(await readFile('package.json','utf8'));
          assert.equal(process.env.RCSK_RELEASE_TAG,'v'+pkg.version);
          assert.equal(GAME_VERSION,pkg.version);
          JS
          gh release view "$RCSK_RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare the game payload and original icons
        run: npm run desktop:prepare
      - name: Create DMG and ZIP packages with ad-hoc signing
        run: |
          npx --no-install electron-builder --mac "--$RCSK_BUILD_ARCH" --publish never \
            "-c.directories.output=release/macos-$RCSK_BUILD_ARCH"
      - name: Upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RCSK_RELEASE_TAG" \
            "release/macos-$RCSK_BUILD_ARCH/"*.dmg \
            "release/macos-$RCSK_BUILD_ARCH/"*.zip \
            --repo "$GITHUB_REPOSITORY"
      - name: Upload payload integrity report
        if: ${{ !inputs.skip_build_checks }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RCSK_RELEASE_TAG" \
            "release/macos-$RCSK_BUILD_ARCH/"integrity-darwin-*.json \
            --repo "$GITHUB_REPOSITORY"
