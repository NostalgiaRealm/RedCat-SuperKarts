# RedCat SuperKarts at https://games.nostalgiarealm.com/redcatsuperkarts/: the recompiled port (2.0.0), with the
# JavaScript port (1.0.x) kept beside it at /redcatsuperkarts/classic/.
#
# This takes the place of the one block "location /redcatsuperkarts/ { ... }" in the server block of
# games.nostalgiarealm.com (/etc/nginx/sites-available/games.nostalgiarealm.com, as it was on 25 November 2026): put
# this file at /etc/nginx/snippets/redcatsuperkarts-recomp.conf and write, where that block was,
#     include /etc/nginx/snippets/redcatsuperkarts-recomp.conf;
# The two locations above it stay as they are (the regex one also keeps dotfiles of both folders away):
#     location = /redcatsuperkarts { return 301 /redcatsuperkarts/; }
#     location ~ ^/redcatsuperkarts/(?:\.|.*/\.) { return 404; }
#
# Folders on the server, side by side:
#     /var/www/games.nostalgiarealm.com/redcatsuperkarts-recomp/   this port (dist/site; tools/deploy-site.sh)
#     /var/www/games.nostalgiarealm.com/redcatsuperkarts/          the JavaScript port, untouched (its own
#                                                                  tools/deploy-website.sh mirrors into it with --delete,
#                                                                  so this port must not live inside it)
# Nothing is moved: the switch is this change plus a reload, and going back is the old block plus a reload.
#
# Needs nginx-redcatsuperkarts-cache.conf (the variable $redcatsuperkarts_cache_control) in the http block.
# The steps are in docs/hosting.md. Not run through nginx here (none installed): "sudo nginx -t".

    # RedCat SuperKarts, recompiled port.
    location /redcatsuperkarts/ {
        alias /var/www/games.nostalgiarealm.com/redcatsuperkarts-recomp/;
        index index.html;
        autoindex off;
        # the server block's types (mime.types plus wav and ttf) are inherited

        # The page shares memory with the game worker and the render worker, which a browser only allows on an
        # isolated page: without these two headers no race starts (the page then says so and offers classic/).
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;

        # What a browser may keep, by folder (the other file). A location with add_header lines of its own no longer
        # gets the server's "Cache-Control: no-cache" nor its security headers: the first line replaces the one, the
        # include repeats the others.
        add_header Cache-Control $redcatsuperkarts_cache_control;
        include /etc/nginx/snippets/security-headers.conf;

        # The .gz copy that lies next to a file, to a browser that accepts it (the game module 4.0 MB as 1.0 MB, a
        # track's files, the INI files). The packed archives data/rcs.img and data/rc.img have none: the race reads
        # them by byte ranges (Range: bytes=a-b, answered 206 by nginx's static module), and gzip_static would answer a
        # range with bytes of the .gz. Nor have the movies and voices (the browser asks for those by ranges too).
        # No dynamic gzip here: the old block's "gzip_types ... application/octet-stream" would pack data/ on the fly.
        gzip off;
        gzip_static on;
        gzip_vary on;
    }

    # The JavaScript port, answered as it was until now (the old block with another address): the server's headers
    # (Cache-Control: no-cache, the security headers; no isolation headers), its gzip. Its saves are the same
    # localStorage keys as this port's on this origin, so both versions see the same players and records.
    location /redcatsuperkarts/classic/ {
        alias /var/www/games.nostalgiarealm.com/redcatsuperkarts/;
        gzip on;
        gzip_vary on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types application/json application/javascript text/javascript text/css image/svg+xml font/ttf application/octet-stream;
        index index.html;
        autoindex off;
    }
