# RedCat SuperKarts, recompiled port: what a browser may keep, by folder.
#
# http-level part: a "map" is only allowed in the http block. On Debian, files in /etc/nginx/conf.d/ are included
# there (the server has conf.d/redcatspookkasteel-recomp-cache.conf already), so put this file at
# /etc/nginx/conf.d/redcatsuperkarts-recomp-cache.conf. Used by nginx-redcatsuperkarts.conf and -test.conf.
# Its own variable name: $redcat_cache_control is RedCat Spookkasteel's.
#
#   app/     scripts and the game module and its lists. Every build has its own folder name below app/, so a file
#            under a given address never changes.
#   data/    the original game files. They do not change (also rcs.img, read by byte ranges).
#   assets/  menu art, voices, movies, help: kept for a day.
#   other    index.html and build.json: checked with the server every time ("no-cache": the browser may keep a copy
#            but must ask whether it is current).
# The old version under classic/ has its own location and does not use this variable.
# "(?:-test)?" also covers the temporary address of nginx-redcatsuperkarts-test.conf.

map $uri $redcatsuperkarts_cache_control {
    default                                 "no-cache";
    ~^/redcatsuperkarts(?:-test)?/app/      "public, max-age=31536000, immutable";
    ~^/redcatsuperkarts(?:-test)?/data/     "public, max-age=31536000, immutable";
    ~^/redcatsuperkarts(?:-test)?/assets/   "public, max-age=86400";
}
