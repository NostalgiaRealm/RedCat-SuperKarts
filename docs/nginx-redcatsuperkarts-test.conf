# RedCat SuperKarts, recompiled port: a temporary address to try the uploaded package on the real server before the
# switch. https://games.nostalgiarealm.com/redcatsuperkarts-test/
#
# The same location as the final one (nginx-redcatsuperkarts.conf) under another address; the live game is not
# touched by it. Put this file at /etc/nginx/snippets/redcatsuperkarts-recomp-test.conf, include it inside the server
# block of games.nostalgiarealm.com, check with tools/site-check.mjs, and take the include line out again at the
# switch. Needs nginx-redcatsuperkarts-cache.conf in the http block. Steps: docs/hosting.md.

    location = /redcatsuperkarts-test {
        return 301 /redcatsuperkarts-test/$is_args$args;
    }

    location ~ ^/redcatsuperkarts-test/(?:\.|.*/\.) {
        return 404;
    }

    location /redcatsuperkarts-test/ {
        alias /var/www/games.nostalgiarealm.com/redcatsuperkarts-recomp/;
        index index.html;
        autoindex off;
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control $redcatsuperkarts_cache_control;
        include /etc/nginx/snippets/security-headers.conf;
        gzip off;
        gzip_static on;
        gzip_vary on;
    }
